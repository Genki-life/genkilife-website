<style>
  /* ============================================================
     Breathe tool — built on top of the site's existing design
     tokens (assets/styles.css). No new color/type system here;
     every value below is pulled from the shared :root or matches
     the patterns already used in .tool-shell / .layer-card /
     .count-pill elsewhere on the site.
     ============================================================ */

  .breathe-shell {
    height: calc(100vh - 90px);
    height: calc(100dvh - 90px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(16px, 5vh, 60px) clamp(16px, 4vw, 24px);
    overflow: hidden; /* 工具区严格等于可用空间，绝不让外层页面产生滚动；
                          矮屏下内容由内部各屏自身的 clamp() 压缩适配，
                          极端情况下退化为各屏内部局部滚动（见 .bt-screen）*/
  }

  .bt-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(8px, 3vh, 40px) clamp(16px, 4vw, 24px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
    overflow-y: auto; /* 保险丝：理论上 clamp() 压缩后内容应始终装得下，
                          万一极端尺寸仍超出，滚动被限制在卡片内部而非
                          整个站点页面（footer 不会被卷进来） */
    -webkit-overflow-scrolling: touch;
  }
  .bt-screen.active { opacity: 1; pointer-events: auto; }
  #bt-screen-breathing { overflow: hidden; }

  .bt-stage {
    position: relative;
    width: 100%;
    height: 100%;
  }

  /* ---------- Screen 1: mission select ---------- */
  .bt-select-wrap { width: 100%; max-width: 460px; text-align: center; }

  .bt-select-title {
    font-size: clamp(20px, 4.5vh, 34px);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.15;
    margin-bottom: clamp(14px, 3vh, 36px);
    color: var(--ink);
  }

  .bt-mission-list { display: flex; flex-direction: column; gap: clamp(6px, 1.4vh, 10px); }

  .bt-mission-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-align: left;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: clamp(12px, 2.4vh, 20px) clamp(16px, 3vw, 24px);
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .bt-mission-card:hover { border-color: var(--accent); background: var(--bg-soft); }
  .bt-mission-card:active { transform: scale(0.985); }

  .bt-mission-name { font-size: 17px; font-weight: 700; letter-spacing: -0.015em; color: var(--ink); margin-bottom: 3px; }
  .bt-mission-sub { font-size: 13.5px; color: var(--ink-3); }
  .bt-mission-arrow { color: var(--ink-3); font-size: 18px; flex-shrink: 0; margin-left: 16px; }

  /* ---------- Screen 2: breathing ---------- */
  .bt-breathing-wrap {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(18px, 4vh, 32px);
    position: relative;
  }

  .bt-timer {
    position: absolute;
    top: clamp(-12px, calc(2vh - 20px), -4px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    font-size: clamp(20px, 5.5vw, 26px);
    font-weight: 800;
    letter-spacing: -0.01em;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    background: rgba(255, 255, 255, 0.88);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    padding: 6px 18px;
    border-radius: 100px;
    border: 1px solid var(--line);
    box-shadow: 0 8px 30px rgba(20,18,40,0.06);
  }

  .bt-stage-ring {
    flex: 0 0 auto;
    position: relative;
    width: min(64vw, 280px);
    max-width: 70vh;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .bt-ambient-glow {
    position: absolute;
    inset: -12%;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 55%, rgba(83,74,183,0.10) 0%, rgba(83,74,183,0) 70%);
    transform: scale(0.85);
    opacity: 0.65;
    transition: transform 1.2s cubic-bezier(0.45, 0, 0.2, 1), opacity 1.2s cubic-bezier(0.45, 0, 0.2, 1);
  }
  .bt-stage-ring.inhale .bt-ambient-glow { transform: scale(1.18); opacity: 1; }
  .bt-stage-ring.hold .bt-ambient-glow   { transform: scale(1.1);  opacity: 0.9; }
  .bt-stage-ring.exhale .bt-ambient-glow { transform: scale(0.78); opacity: 0.5; }

  #bt-lottie-head { width: 100%; height: 100%; position: relative; z-index: 1; }

  .bt-phase-label {
    flex: 0 0 auto;
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
    min-height: 24px;
    letter-spacing: -0.01em;
  }

  @media (max-height: 600px) {
    .bt-breathing-wrap { gap: clamp(10px, 2.5vh, 18px); }
    .bt-stage-ring { width: min(40vh, 220px); }
  }

  /* ---------- Screen 3: summary + feedback ----------
     Redesigned to match the site's restrained palette: no colored
     emoji blobs. Selection state uses --accent (the one purple the
     whole site allows) on a pill, exactly like .count-pill / .chip. */
  .bt-summary-wrap { width: 100%; max-width: 420px; text-align: center; }

  .bt-summary-ritual { font-size: 14px; color: var(--ink-3); margin: 0 0 clamp(4px, 1vh, 8px); }

  .bt-summary-headline {
    font-size: clamp(19px, 4vh, 30px);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.25;
    color: var(--ink);
    margin: 0 0 clamp(16px, 3.5vh, 40px);
  }

  .bt-feedback-prompt {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin: 0 0 clamp(8px, 1.6vh, 16px);
  }

  .bt-feedback-row {
    display: flex;
    gap: 8px;
    justify-content: center;
  }

  .bt-feedback-btn {
    flex: 1;
    font-family: var(--sans);
    font-size: 14.5px;
    font-weight: 600;
    color: var(--ink-2);
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 100px;
    padding: 13px 8px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease, transform 0.1s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .bt-feedback-btn:hover { border-color: var(--accent); }
  .bt-feedback-btn:active { transform: scale(0.96); }

  .bt-feedback-btn.selected {
    border-color: var(--accent);
    border-width: 2px;
    background: var(--accent);
    background-color: var(--accent); /* 显式 background-color（而非仅 background 简写）
                                          —— 部分浏览器/系统级渲染模式（如 iOS 分享面板
                                          的页面快照）会剥离 background 简写属性，
                                          background-color 更不容易被滤掉 */
    box-shadow: inset 0 0 0 2px var(--accent); /* 双重保险：即使背景色被剥离，
                                                     内阴影仍能撑出深色填充观感 */
    color: #fff;
  }
  .bt-feedback-btn.dimmed { opacity: 0.4; }

  .bt-comfort-line {
    margin-top: 24px;
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--ink-2);
    min-height: 20px;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .bt-comfort-line.show { opacity: 1; transform: translateY(0); }

  .bt-home-btn {
    margin-top: 32px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 100px;
    padding: 13px 28px;
    background: var(--ink);
    background-color: var(--ink); /* 同上：显式 background-color 防止被特殊渲染模式剥离 */
    box-shadow: inset 0 0 0 2px var(--ink);
    color: #fff;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease, transform 0.1s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .bt-home-btn.show { opacity: 1; pointer-events: auto; }
  .bt-home-btn:active { transform: scale(0.97); }

  /* ===== DEBUG ONLY — remove this whole block before real launch ===== */
  .bt-debug-btn {
    position: fixed;
    bottom: max(16px, env(safe-area-inset-bottom));
    z-index: 50;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #b3401a;
    background: #fff4ec;
    border: 1px dashed #e0631f;
    border-radius: 10px;
    padding: 8px 12px;
    cursor: pointer;
    opacity: 0.85;
    transition: opacity 0.15s ease, transform 0.1s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .bt-debug-btn:hover { opacity: 1; }
  .bt-debug-btn:active { transform: scale(0.96); }
  .bt-debug-btn--left { left: 16px; }
  .bt-debug-btn--right { right: 16px; }
  /* ===== END DEBUG ONLY ===== */

  @media (max-width: 600px) {
    .bt-select-title { margin-bottom: 28px; }
    .bt-mission-card { padding: 16px 18px; }
  }
</style>
</head>

        <p class="bt-comfort-line" id="btComfortLine">&#12288;</p>
        <button class="bt-home-btn" id="btHomeBtn">Start Again</button>
      </div>
    </section>

  </div>
</main>

<div id="site-footer-root"></div>

        { from: 30, to: 60, duration: 0,   label: 'Hold',   phase: 'hold' },
        { from: 60, to: 90, duration: 4,   label: 'Exhale', phase: 'exhale' },
      ],
    },
    box: {
      name: 'Improve Focus',
      subtitle: 'Box Breathing · Into Flow',
      missionLabel: 'Focus',
      segments: [
        { from: 0,   to: 30,  duration: 4, label: 'Inhale', phase: 'inhale' },
        { from: 30,  to: 60,  duration: 4, label: 'Hold',   phase: 'hold' },
        { from: 60,  to: 90,  duration: 4, label: 'Exhale', phase: 'exhale' },
        { from: 90,  to: 120, duration: 4, label: 'Hold',   phase: 'hold' },
      ],
    },
    sleep478: {
      name: 'Sleep & Relax',
      subtitle: '4-7-8 · Invite Drowsiness',
      missionLabel: 'Sleep',
      segments: [
        { from: 0,  to: 30, duration: 4, label: 'Inhale', phase: 'inhale' },
        { from: 30, to: 60, duration: 7, label: 'Hold',   phase: 'hold' },
        { from: 60, to: 90, duration: 8, label: 'Exhale', phase: 'exhale' },
        { from: 90, to: 120, duration: 0, label: '', phase: 'hold' },
      ],
    },
  };

  const SESSION_SECONDS = 90;

  // ============================================================
  // 2. DOM refs
  // ============================================================
  const screens = {
    select: document.getElementById('bt-screen-select'),
    breathing: document.getElementById('bt-screen-breathing'),
    summary: document.getElementById('bt-screen-summary'),
  };
  const missionList = document.getElementById('btMissionList');
  const timerLabel = document.getElementById('btTimerLabel');
  const stageRing = document.getElementById('btStageRing');
  const phaseLabel = document.getElementById('btPhaseLabel');
  const summaryHeadline = document.getElementById('btSummaryHeadline');
  const feedbackRow = document.getElementById('btFeedbackRow');
  const comfortLine = document.getElementById('btComfortLine');
  const homeBtn = document.getElementById('btHomeBtn');

  // ============================================================
  // 3. Screen 1: render mission cards
  // ============================================================
  const MISSION_ORDER = ['sigh', 'box', 'sleep478'];
  MISSION_ORDER.forEach((key) => {
    const p = PROTOCOLS[key];
    const card = document.createElement('div');
    card.className = 'bt-mission-card';
    card.innerHTML = `
      <div>
        <p class="bt-mission-name">${p.name}</p>
        <p class="bt-mission-sub">${p.subtitle}</p>
      </div>
      <span class="bt-mission-arrow">&rarr;</span>
    `;
    card.addEventListener('click', () => startSession(key));
    missionList.appendChild(card);
  });

  function showScreen(name) {
    Object.values(screens).forEach((el) => el.classList.remove('active'));
    screens[name].classList.add('active');
  }

  // ============================================================
  // 4. Lottie instance (lazy, reused across rounds)
  // ============================================================
  let anim = null;
  function ensureAnim() {
    if (anim) return anim;
    anim = lottie.loadAnimation({
      container: document.getElementById('bt-lottie-head'),
      renderer: 'svg',
      loop: false,
      autoplay: false,
      animationData: ANIMATION_DATA,
      rendererSettings: { preserveAspectRatio: 'xMidYMid meet' },
    });
    return anim;
  }

  // ============================================================
  // 5. Segmented playback engine
  //    onTick(seg, secondsLeft) driven by requestAnimationFrame using
  //    performance.now() timestamps recorded at each segment start.
  //    Deliberately NOT using lottie's enterFrame/currentFrame —
  //    those values get reset relative to the active playSegments()
  //    call in lottie-web, which silently breaks countdown math for
  //    any segment whose `from` isn't 0 (confirmed via direct testing).
  //    Wall-clock time we control ourselves has no such ambiguity.
  // ============================================================
  let engineRunning = false;
  let engineSegIndex = 0;
  let engineOnSegmentChange = null;
  let engineOnTick = null;
  let engineCurrentSeg = null;
  let engineSegStartTime = 0;
  let engineRafId = null;

  function speedFor(seg) {
    const nativeSec = (seg.to - seg.from) / NATIVE_FPS;
    return nativeSec / seg.duration;
  }

  function playNextSegment(protocol) {
    if (!engineRunning) return;

    while (protocol.segments[engineSegIndex] && protocol.segments[engineSegIndex].duration === 0) {
      engineSegIndex++;
    }

    if (engineSegIndex >= protocol.segments.length) {
      engineSegIndex = 0;
      playNextSegment(protocol);
      return;
    }

    const seg = protocol.segments[engineSegIndex];
    engineCurrentSeg = seg;
    engineSegStartTime = performance.now();
    if (typeof engineOnSegmentChange === 'function') {
      engineOnSegmentChange(seg);
    }
    if (typeof engineOnTick === 'function') {
      engineOnTick(seg, Math.ceil(seg.duration));
    }

    const a = ensureAnim();
    a.setSpeed(speedFor(seg));
    a.goToAndStop(seg.from, true);
    a.playSegments([seg.from, seg.to], true);
  }

  function engineTickLoop() {
    if (!engineRunning) {
      engineRafId = null;
      return;
    }
    if (engineCurrentSeg) {
      const seg = engineCurrentSeg;
      const elapsedSec = (performance.now() - engineSegStartTime) / 1000;
      const progress = seg.duration > 0 ? Math.min(1, elapsedSec / seg.duration) : 1;
      const secondsLeft = Math.max(1, Math.ceil(seg.duration * (1 - progress)));
      if (typeof engineOnTick === 'function') {
        engineOnTick(seg, secondsLeft);
      }
    }
    engineRafId = requestAnimationFrame(engineTickLoop);
  }

  function startEngine(protocolKey, onSegmentChange, onTick) {
    const protocol = PROTOCOLS[protocolKey];
    engineRunning = true;
    engineSegIndex = 0;
    engineOnSegmentChange = onSegmentChange;
    engineOnTick = onTick;

    const a = ensureAnim();
    a.removeEventListener('complete', a.__breatheCompleteHandler || (() => {}));
    a.__breatheCompleteHandler = () => {
      if (!engineRunning) return;
      engineSegIndex++;
      playNextSegment(protocol);
    };
    a.addEventListener('complete', a.__breatheCompleteHandler);

    playNextSegment(protocol);

    if (engineRafId === null) {
      engineRafId = requestAnimationFrame(engineTickLoop);
    }
  }

  function stopEngine() {
    engineRunning = false;
    engineCurrentSeg = null;
    if (anim) anim.pause();
    if (engineRafId !== null) {
      cancelAnimationFrame(engineRafId);
      engineRafId = null;
    }
  }

  // ============================================================
  // 6. Session control: countdown + state machine
  // ============================================================
  let countdownTimerId = null;
  let currentProtocolKey = null;

  function formatTime(totalSec) {
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  function renderPhaseLabel(seg, secondsLeft) {
    phaseLabel.textContent = seg.label ? `${seg.label} (${secondsLeft}s)` : '';
  }

  function startSession(protocolKey) {
    const protocol = PROTOCOLS[protocolKey];
    currentProtocolKey = protocolKey;
    showScreen('breathing');

    let remaining = SESSION_SECONDS;
    timerLabel.textContent = formatTime(remaining);

    startEngine(
      protocolKey,
      (seg) => {
        stageRing.classList.remove('inhale', 'hold', 'exhale');
        stageRing.classList.add(seg.phase);
      },
      (seg, secondsLeft) => {
        renderPhaseLabel(seg, secondsLeft);
      }
    );

    countdownTimerId = setInterval(() => {
      remaining -= 1;
      timerLabel.textContent = formatTime(Math.max(remaining, 0));
      if (remaining <= 0) {
        clearInterval(countdownTimerId);
        countdownTimerId = null;
        finishSession(protocolKey);
      }
    }, 1000);
  }

  function finishSession(protocolKey) {
    stopEngine();
    const protocol = PROTOCOLS[protocolKey];
    const sessionLabel = SESSION_SECONDS % 60 === 0
      ? `${SESSION_SECONDS / 60} min`
      : `${SESSION_SECONDS}s`;
    summaryHeadline.textContent = `You've completed ${sessionLabel} of ${protocol.missionLabel} training.`;
    resetFeedbackUI();
    showScreen('summary');
  }

  // ============================================================
  // 7. Summary feedback
  // ============================================================
  const COMFORT_LINES = {
    better: 'Hold onto this calm. Wishing you a smooth rest of your day.',
    same: 'Change takes time — next time may feel more noticeable.',
    restless: "That's okay. Be patient with yourself, and come back anytime.",
  };

  let feedbackLocked = false; // 选定一次后锁住，本轮内不能再改选

  function resetFeedbackUI() {
    feedbackLocked = false;
    document.querySelectorAll('.bt-feedback-btn').forEach((btn) => {
      btn.classList.remove('selected', 'dimmed');
    });
    comfortLine.textContent = '\u3000';
    comfortLine.classList.remove('show');
    homeBtn.classList.remove('show');
  }

  feedbackRow.addEventListener('click', (e) => {
    if (feedbackLocked) return; // 已选过：本轮内忽略后续点击，保持单选不可改
    const btn = e.target.closest('.bt-feedback-btn');
    if (!btn) return;

    feedbackLocked = true;
    document.querySelectorAll('.bt-feedback-btn').forEach((b) => {
      b.classList.remove('selected');
      b.classList.toggle('dimmed', b !== btn);
    });
    btn.classList.add('selected');

    const value = btn.getAttribute('data-value');
    comfortLine.textContent = COMFORT_LINES[value] || '';
    comfortLine.classList.add('show');
    homeBtn.classList.add('show');
  });

  homeBtn.addEventListener('click', () => {
    // 离开小结页前清掉 .show/.selected/.dimmed 残留状态 —— 否则 btHomeBtn 自身的
    // pointer-events:auto 会覆盖父级 .bt-screen 的 pointer-events:none，
    // 继续悬浮在可点击层挡住首屏卡片（实测会导致首屏卡片点不中）。
    resetFeedbackUI();
    showScreen('select');
  });

  // ============================================================
  // 8. DEBUG ONLY — force-abort current session. Remove this whole
  //    block (and the two .bt-debug-btn elements in the HTML above)
  //    before real launch.
  // ============================================================
  function abortSession() {
    if (countdownTimerId) {
      clearInterval(countdownTimerId);
      countdownTimerId = null;
    }
    stopEngine();
  }

  const debugBackBtn = document.getElementById('btDebugBackBtn');
  const debugSkipBtn = document.getElementById('btDebugSkipBtn');

  debugBackBtn.addEventListener('click', () => {
    abortSession();
    showScreen('select');
  });

  debugSkipBtn.addEventListener('click', () => {
    const activeProtocolKey = currentProtocolKey;
    abortSession();
    resetFeedbackUI();
    if (activeProtocolKey) {
      const protocol = PROTOCOLS[activeProtocolKey];
      const sessionLabel = SESSION_SECONDS % 60 === 0
        ? `${SESSION_SECONDS / 60} min`
        : `${SESSION_SECONDS}s`;
      summaryHeadline.textContent = `You've completed ${sessionLabel} of ${protocol.missionLabel} training.`;
    }
    showScreen('summary');
  });
})();
</script>

</body>
</html>
